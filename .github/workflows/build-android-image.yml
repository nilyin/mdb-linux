name: Build & Publish Android Dev Image

on:
  workflow_dispatch:

jobs:
  build-image:
    name: Build and Push Android Docker Image
    runs-on: ubuntu-latest
    environment: default # Specifies the environment name
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.ANDROID_IMAGE_BUILD_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}:android-ndk-latest
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
